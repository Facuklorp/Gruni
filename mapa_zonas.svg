<svg xmlns="http://www.w3.org/2000/svg" width="1260" height="660">
  <!-- Fondo Blanco -->
  <rect width="1260" height="660" fill="white" />
  
  <g font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="middle" dominant-baseline="middle">
    
    <!-- Z. de Hielo (0, 2) -->
    <rect x="320" y="10" width="300" height="150" fill="#a5f2f3" rx="15" />
    <text x="470" y="85" fill="black">Zonas de Hielo</text>

    <!-- M. Nevadas (0, 1) -->
    <rect x="320" y="170" width="300" height="150" fill="#e2e8f0" rx="15" />
    <text x="470" y="245" fill="black">Montañas Nevadas</text>
    
    <!-- Bosque Mágico (1, 1) -->
    <rect x="630" y="170" width="300" height="150" fill="#c084fc" rx="15" />
    <text x="780" y="245" fill="white">Bosque Mágico</text>

    <!-- Cementerio (2, 1) -->
    <rect x="940" y="170" width="300" height="150" fill="#92400e" rx="15" />
    <text x="1090" y="235" fill="white">Cementerio</text>
    <text x="1090" y="255" fill="white">de Animales</text>

    <!-- Aldea y Campo (-1, 0) -->
    <rect x="10" y="330" width="300" height="150" fill="#bef264" rx="15" />
    <text x="160" y="405" fill="black">Aldea y Campo</text>
    
    <!-- Pradera (0, 0) -->
    <rect x="320" y="330" width="300" height="150" fill="#4ade80" rx="15" />
    <text x="470" y="405" fill="black">Pradera (Centro)</text>
    
    <!-- Bosque y Río (1, 0) -->
    <rect x="630" y="330" width="300" height="150" fill="#0d9488" rx="15" />
    <text x="780" y="405" fill="white">Bosque y Río</text>

    <!-- Playa (-1, -1) -->
    <rect x="10" y="490" width="300" height="150" fill="#fde047" rx="15" />
    <text x="160" y="565" fill="black">Playa</text>

    <!-- Desierto (0, -1) -->
    <rect x="320" y="490" width="300" height="150" fill="#fb923c" rx="15" />
    <text x="470" y="565" fill="white">Desierto</text>

  </g>
</svg>
