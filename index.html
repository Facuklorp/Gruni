<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulador de Dios</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <!-- Panel Izquierdo: Estadísticas del Agente -->
        <aside class="glass-panel agent-panel">
            <h2>El Agente</h2>
            <div class="stat-group">
                <label>Hambre</label>
                <div class="progress-bar"><div id="bar-hunger" class="progress-fill warning"></div></div>
            </div>
            <div class="stat-group">
                <label>Sed</label>
                <div class="progress-bar"><div id="bar-thirst" class="progress-fill danger"></div></div>
            </div>
            <div class="stat-group">
                <label>Estado Actual</label>
                <div id="agent-state" class="badge">Deambulando</div>
            </div>
            <div class="stat-group inventory">
                <h3>Inventario</h3>
                <ul id="agent-inventory">
                    <li>Madera: <span id="inv-wood">0</span></li>
                    <li>Roca: <span id="inv-rock">0</span></li>
                    <li>Puentes: <span id="inv-bridges">0</span></li>
                    <li>Picos: <span id="inv-pickaxes">0</span></li>
                </ul>

                <h3 style="margin-top: 15px; font-size: 0.9rem; color: var(--text-muted);">Progreso de Crafteo</h3>
                <div class="stat-group" style="margin-top: 10px;">
                    <div class="stat">
                        <div class="stat-label">Puente <span style="font-size: 0.75rem">(Madera: <span id="craft-bridge-text">0</span>/3)</span></div>
                        <div class="bar-container">
                            <div class="bar" id="bar-craft-bridge" style="background: #a8a29e; width: 0%;"></div>
                        </div>
                    </div>
                    <div class="stat" style="margin-top: 10px;">
                        <div class="stat-label">Pico <span style="font-size: 0.75rem">(M: <span id="craft-pick-w">0</span>/2 | R: <span id="craft-pick-r">0</span>/2)</span></div>
                        <div class="bar-container">
                            <div class="bar" id="bar-craft-pickaxe" style="background: #78716c; width: 0%;"></div>
                        </div>
                    </div>
                </div>
            </div>
        </aside>

        <!-- Centro: El Mundo (Canvas) -->
        <main class="canvas-container">
            <canvas id="gameCanvas" width="600" height="600"></canvas>
        </main>

        <!-- Panel Derecho: Controles de Dios -->
        <aside class="glass-panel god-panel">
            <h2>Modo Dios</h2>
            <p style="margin-bottom: 15px; font-size: 0.9rem; color: #94a3b8;">Selecciona un recurso y haz clic en el mapa.</p>
            <div class="tool-grid">
                <button class="tool-btn active" data-tool="food">🍎 Comida</button>
                <button class="tool-btn" data-tool="water">💧 Agua</button>
                <button class="tool-btn" data-tool="wood">🌳 Árbol</button>
                <button class="tool-btn" data-tool="rock">🪨 Roca</button>
                <button class="tool-btn" data-tool="clear">❌ Borrar</button>
            </div>
            <div class="global-actions">
                <button id="btn-rain" class="action-btn primary">🌧️ Hacer Llover</button>
                <button id="btn-lightning" class="action-btn danger">⚡ Lanzar Rayo</button>
            </div>
        </aside>
    </div>
    <script type="module" src="js/main.js"></script>
</body>
</html>
